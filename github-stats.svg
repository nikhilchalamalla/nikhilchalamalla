<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220">
<style>
  .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1; }
  .dot { rx: 50%; ry: 50%; }
  .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #58a6ff; font-weight: bold; }
  .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #8b949e; }
  .val { font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; fill: #39d353; font-weight: bold; }
  .grade { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 32px; fill: #58a6ff; font-weight: 800; }
</style>
  <rect class="bg" x="0" y="0" width="420" height="220" />
  <circle class="dot" cx="16" cy="16" r="5" fill="#ff5f56" />
  <circle class="dot" cx="30" cy="16" r="5" fill="#ffbd2e" />
  <circle class="dot" cx="44" cy="16" r="5" fill="#27c93f" />
  <text class="title" x="60" y="20">Nikhil's GitHub Stats</text>
  <line x1="0" y1="30" x2="420" y2="30" stroke="#30363d" stroke-width="1" />
  <text class="label" x="20" y="65">Total Contributions (Past Year):</text>
  <text class="val" x="260" y="65">326</text>
