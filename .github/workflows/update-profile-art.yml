name: Update Profile Art & Heatmap

on:
  schedule:
    - cron: "17 6 * * *"   # Runs daily at ~06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 pillow numpy opencv-python

      - name: Fetch Live Contribution Data
        run: python scripts/fetch_contributions.py

      - name: Render Heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Auto-commit Updated Heatmap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph SVG [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
